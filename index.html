<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>围棋小岛</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#212529">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="围棋小岛">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
  <span class="brand">围棋小岛</span>
  <div class="navRight">
    <button id="btnAdv" class="navBtn">🗺️ 冒险</button>
    <select id="selSize" class="navSel">
      <option value="5" selected>5 × 5</option>
      <option value="7">7 × 7</option>
      <option value="9">9 × 9</option>
    </select>
    <button id="btnHowto" class="navBtn">怎么玩</button>
  </div>
</nav>

<main class="stage">
  <div id="boardWrap" class="boardArea">
    <div id="missionBar" class="missionBar">
      <span id="missionText"></span>
      <span class="missionBtns">
        <button id="missionHint">💡</button>
        <button id="missionRetry">🔁</button>
        <button id="missionMap">🗺️</button>
      </span>
    </div>
    <canvas id="board"></canvas>
  </div>

  <div class="scoreBar">
    <div id="sideBlack" class="side black active">
      <svg viewBox="-50 -50 100 100" class="barStone"><circle r="40" class="bBody"/>
        <circle cx="-19" cy="0" r="4.5" class="bFace"/><circle cx="19" cy="0" r="4.5" class="bFace"/>
        <path d="M -8 2 A 4.2 4.2 0 0 0 0 2 A 4.2 4.2 0 0 0 8 2" class="bMouth"/></svg>
      <span id="cntBlack" class="cnt">0</span>
    </div>
    <div id="sideWhite" class="side white">
      <span id="cntWhite" class="cnt">0</span>
      <svg viewBox="-50 -50 100 100" class="barStone"><circle r="40" class="wBody"/>
        <circle cx="-19" cy="0" r="4.5" class="bFace"/><circle cx="19" cy="0" r="4.5" class="bFace"/>
        <path d="M -8 2 A 4.2 4.2 0 0 0 0 2 A 4.2 4.2 0 0 0 8 2" class="bMouth"/></svg>
    </div>
  </div>

  <div class="ctrlRow">
    <button id="btnPass" class="btn blue">跳过</button>
    <button id="btnUndo" class="btn blue">悔棋</button>
    <button id="btnNew" class="btn ghost">重新开始</button>
    <select id="selOpp" class="oppSel">
      <option value="cloud" selected>☁️ 和小云朵下</option>
      <option value="star">⭐ 和小星星下</option>
      <option value="moon">🌙 和小月亮下</option>
      <option value="pvp">👨‍👩‍👧 两个人玩</option>
    </select>
  </div>
</main>

<div id="toast" class="toast"></div>

<!-- 开局选子 -->
<div id="colorPick" class="overlay">
  <div class="ovCard">
    <div class="ovTitle small">你想用哪个小团子呀？</div>
    <div class="pickRow">
      <button id="pickBlack" class="pickBtn">
        <svg viewBox="-50 -50 100 100" class="pickStone"><circle r="40" class="bBody"/>
          <circle cx="-19" cy="0" r="4.5" class="bFace"/><circle cx="19" cy="0" r="4.5" class="bFace"/>
          <path d="M -8 2 A 4.2 4.2 0 0 0 0 2 A 4.2 4.2 0 0 0 8 2" class="bMouth"/></svg>
        <span>黑棋<small>先走</small></span>
      </button>
      <button id="pickWhite" class="pickBtn">
        <svg viewBox="-50 -50 100 100" class="pickStone"><circle r="40" class="wBody"/>
          <circle cx="-19" cy="0" r="4.5" class="bFace"/><circle cx="19" cy="0" r="4.5" class="bFace"/>
          <path d="M -8 2 A 4.2 4.2 0 0 0 0 2 A 4.2 4.2 0 0 0 8 2" class="bMouth"/></svg>
        <span>白棋<small>后走</small></span>
      </button>
    </div>
  </div>
</div>

<!-- 终局 -->
<div id="overlay" class="overlay">
  <div class="ovCard">
    <div id="ovTitle" class="ovTitle">你赢啦！🎉</div>
    <div class="ovScore">
      <span class="ovSide"><svg viewBox="-50 -50 100 100" class="barStone big"><circle r="40" class="bBody"/>
        <circle cx="-19" cy="0" r="4.5" class="bFace"/><circle cx="19" cy="0" r="4.5" class="bFace"/>
        <path d="M -8 2 A 4.2 4.2 0 0 0 0 2 A 4.2 4.2 0 0 0 8 2" class="bMouth"/></svg>
        <b id="ovBlackCnt">0</b></span>
      <span class="ovVs">VS</span>
      <span class="ovSide"><b id="ovWhiteCnt">0</b>
        <svg viewBox="-50 -50 100 100" class="barStone big"><circle r="40" class="wBody"/>
        <circle cx="-19" cy="0" r="4.5" class="bFace"/><circle cx="19" cy="0" r="4.5" class="bFace"/>
        <path d="M -8 2 A 4.2 4.2 0 0 0 0 2 A 4.2 4.2 0 0 0 8 2" class="bMouth"/></svg></span>
    </div>
    <button id="ovNext" class="nextTip" style="display:none"></button>
    <button id="ovNextStation" class="btn blue wide" style="display:none">🚩 去下一站</button>
    <button id="ovAgain" class="btn blue wide">再来一局</button>
    <button id="ovMap" class="btn ghost wide" style="display:none">🗺️ 回冒险地图</button>
  </div>
</div>

<!-- 冒险地图 -->
<div id="advMap" class="overlay mapOv">
  <div class="ovCard mapCard">
    <div class="mapHead">
      <span id="advTitleBadge" class="mapBadge">🐣 出发！</span>
      <span class="mapTitle">冒险地图</span>
      <span id="advStars" class="mapStars">⭐ × 0</span>
    </div>
    <div class="mapHint">💙 亮亮的是下一站　⭐ 带星星的随时可以再玩一遍</div>
    <div id="advAreas" class="advAreas"></div>
    <button id="advClose" class="btn blue wide">先回去下棋</button>
  </div>
</div>

<!-- 称号升级 -->
<div id="badgeOv" class="overlay">
  <div class="ovCard">
    <div id="badgeIcon" class="badgeIcon">🐣</div>
    <div class="badgeTip">Ada 升级啦！你现在是</div>
    <div id="badgeName" class="badgeName">小棋童</div>
    <button id="badgeClose" class="btn blue wide">耶！继续冒险</button>
  </div>
</div>

<!-- 怎么玩 -->
<div id="howto" class="overlay">
  <div class="ovCard howtoCard">
    <div class="ovTitle small">怎么玩（点卡片听棋棋讲）</div>
    <div class="ruleCard" data-voice="howto1">🖤🤍 <b>规则一</b>　黑棋白棋轮流放，也可以点「跳过」休息一手</div>
    <div class="ruleCard" data-voice="howto2">💨 <b>规则二</b>　被对方团团围住、没有气的棋子，会噗地消失</div>
    <div class="ruleCard" data-voice="howto3">🔁 <b>规则三</b>　棋盘不能变回和以前一模一样的样子</div>
    <div class="ruleCard" data-voice="howto4">🏆 <b>规则四</b>　棋子加上圈好的空地就是地盘，地盘大的一边赢！</div>
    <div class="ruleCard" data-voice="howto_face">😊😟😱 <b>小秘密</b>　团子的表情会告诉你它安不安全哦</div>
    <button id="howtoClose" class="btn blue wide">知道啦</button>
  </div>
</div>

<div id="confetti" class="confetti"></div>

<script src="js/engine.js"></script>
<script src="js/ai.js"></script>
<script src="js/blob.js"></script>
<script src="js/voice_lines.js"></script>
<script src="js/game.js"></script>
<script src="js/adventure.js"></script>
</body>
</html>
